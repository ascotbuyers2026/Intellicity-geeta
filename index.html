<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ascot Homebuyers - Email</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}

h2{
  text-align:center;
  margin-top:0;
}

label{
  font-weight:bold;
  display:block;
  margin-top:14px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:8px;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.gmail{
  background:#d93025;
}

.default{
  background:#222;
}

.note{
  text-align:center;
  font-size:13px;
  color:#666;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

<h2>Ascot Homebuyers</h2>

<label>Name</label>

<input
  id="name"
  type="text"
  placeholder="Enter your name"
>

<label>Unit No.</label>

<input
  id="unit"
  type="text"
  placeholder="Enter your unit number"
>

<button
  class="gmail"
  onclick="openGmail()"
>
Gmail
</button>

<button
  class="default"
  onclick="openDefault()"
>
Default Mail App
</button>

<div class="note">
Name और Unit No. भरकर ऊपर का mail option चुनें.
</div>

</div>

<script>

const to =
"cirpascot@gmail.com,ascotpeople@gmail.com,ar.ascotcirp2025@gmail.com";

const subject =
"Serious Concerns Regarding Unauthorised Interference in the CIRP";


function getBody(){

  const name =
  document.getElementById("name").value.trim();

  const unit =
  document.getElementById("unit").value.trim();

  if(!name || !unit){

    alert("कृपया Name और Unit No. दोनों भरें");

    return null;
  }

  return `Dear Sir/Madam,

Why should we, the Buyers, be dragged into Builder-related fights and unnecessary litigation that only causes further delays to our project?

Let us be realistic that all the Builders are in business to make money through Homebuyers and these Builders are neither sympathetic nor softhearted towards Homebuyers. After losing more than 10 years, we cannot afford further delays or additional financial burden in the CIRP Cost due to IRR and unwanted litigation.

Our only priorities should be early revival, timely delivery and NO additional cost to Homebuyers.

Why should Buyers suffer further delays because of the personal preferences or agendas of certain group leaders who want to control the CIRP or bring in their preferred Builders?

We must remain united and stop unnecessary litigation. RP replacement and IRR involvement are not required as they only add complexity and delay.

Let us not allow personal agendas to derail our project. We need revival and not more disputes, litigation and uncertainty.

Regards

Name: ${name}
Unit No.: ${unit}`;

}


function openGmail(){

  const body = getBody();

  if(!body) return;

  const url =
  "intent://" +
  encodeURIComponent(to) +
  "?subject=" +
  encodeURIComponent(subject) +
  "&body=" +
  encodeURIComponent(body) +
  "#Intent;scheme=mailto;package=com.google.android.gm;end";

  window.location.href = url;

}


function openDefault(){

  const body = getBody();

  if(!body) return;

  const url =
  "mailto:" +
  to +
  "?subject=" +
  encodeURIComponent(subject) +
  "&body=" +
  encodeURIComponent(body);

  window.location.href = url;

}

</script>

</body>
</html>
