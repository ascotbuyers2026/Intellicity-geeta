<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascot Homebuyers - Email</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#24344d;
margin:0;
}
.container{
max-width:650px;
margin:25px auto;
padding:20px;
}
.card{
background:white;
border-radius:18px;
padding:28px;
box-shadow:0 4px 18px rgba(0,0,0,.10);
}
h1{margin:0 0 10px;}
label{
display:block;
margin-top:18px;
font-weight:bold;
}
input{
width:100%;
box-sizing:border-box;
padding:15px;
margin-top:8px;
border:1px solid #ccc;
border-radius:10px;
font-size:17px;
}
button{
width:100%;
padding:15px;
margin-top:15px;
border:0;
border-radius:10px;
color:white;
font-size:17px;
font-weight:bold;
}
.gmail{background:#d93025;}
.outlook{background:#2563eb;}
.yahoo{background:#5b21b6;}
.default{background:#222;}

margin-top:20px;
font-size:15px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Ascot Homebuyers - Email</h1>

<p>कृपया अपना Name और Unit No. भरें और नीचे अपनी Mail App चुनें।</p>

<label>Name</label>
<input id="name" type="text" placeholder="अपना नाम लिखें">

<label>Unit No.</label>
<input id="unit" type="text" placeholder="अपना Unit No. लिखें">

<button class="gmail" onclick="openMail()">Gmail</button>
<button class="outlook" onclick="  openOutlook()>Outlook</button>
<button class="yahoo" onclick="openYahoo()">Yahoo Mail</button>
<button class="default" onclick="openMail()">Default Mail App</button>

<p class="note">
मेल खुलने के बाद To, Subject और Body जाँचकर स्वयं Send दबाएँ।
</p>

</div>
</div>

<script>

const to =
"cirpascot@gmail.com,ascotpeople@gmail.com,ar.ascotcirp2025@gmail.com";

const subject =
"Serious Concerns Regarding Unauthorised Interference in the CIRP";

function openMail(){

let name =
document.getElementById("name").value.trim();

let unit =
document.getElementById("unit").value.trim();

if(!name || !unit){
alert("कृपया Name और Unit No. दोनों भरें।");
return;
}

let body =
"Dear Sir/Madam,\n\n" +

"Why should we, the Buyers, be dragged into Builder-related fights and unnecessary litigation that only causes further delays to our project?\n\n" +

"Let us be realistic that all the Builders are in business to make money through Homebuyers and these Builders are neither sympathetic nor softhearted towards Homebuyers. After losing more than 10 years, we cannot afford further delays or additional financial burden in the CIRP Cost due to IRR and unwanted litigation.\n\n" +

"Our only priorities should be early revival, timely delivery and NO additional cost to Homebuyers.\n\n" +

"Why should Buyers suffer further delays because of the personal preferences or agendas of certain group leaders who want to control the CIRP or bring in their preferred Builders?\n\n" +

"We must remain united and stop unnecessary litigation. RP replacement and IRR involvement are not required as they only add complexity and delay.\n\n" +

"Let us not allow personal agendas to derail our project. We need revival and not more disputes, litigation and uncertainty.\n\n" +


"Regards\n\n" +
"Name: " + name + "\n" +
"Unit No.: " + unit;

let url =
"mailto:" + to +
"?subject=" + encodeURIComponent(subject) +
"&body=" + encodeURIComponent(body);

window.location.href = url;

}
function openOutlook(){
let name=document.getElementById("name").value.trim();
let unit=document.getElementById("unit").value.trim();
if(!name || !unit){alert("कृपया Name और Unit No. दोनों भरें");return;}
let body="Dear Sir/Madam,\n\nName: "+name+"\nUnit No.: "+unit+"\n\nRegards";
let url="https://outlook.live.com/mail/0/deeplink/compose?to="+encodeURIComponent(to)+"&subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
window.location.href=url;
}

function openYahoo(){
let url="https://mail.yahoo.com/"; name=document.getElementById("name").value.trim();
let unit=document.getElementById("unit").value.trim();
if(!name || !unit){alert("कृपया Name और Unit No. दोनों भरें");return;}
let body="Dear Sir/Madam,\n\nName: "+name+"\nUnit No.: "+unit+"\n\nRegards";
let
 subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
window.location.href=url;
}
</script>

</body>
</html>
