<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ascot Homebuyers – Email</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#24344d;
  margin:0;
}

.container{
  max-width:650px;
  margin:25px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:28px;
  box-shadow:0 4px 18px rgba(0,0,0,.10);
}

h1{
  margin-top:0;
  font-size:30px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:16px;
  margin:8px 0 18px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:17px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.gmail{background:#d93025;}
.outlook{background:#0078d4;}
.yahoo{background:#6001d2;}
.default{background:#444;}

.note{
  margin-top:20px;
  color:#666;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Ascot Homebuyers – Email</h1>

<p>
कृपया अपना नाम और Unit No. भरें। इसके बाद अपनी पसंद का Mail App चुनें।
</p>

<label><b>Name</b></label>
<input id="name" type="text" placeholder="अपना नाम लिखें">

<label><b>Unit No.</b></label>
<input id="unit" type="text" placeholder="अपना Unit No. लिखें">

<button class="gmail" onclick="openGmail()">
Gmail
</button>

<button class="outlook" onclick="openOutlook()">
Outlook
</button>

<button class="yahoo" onclick="openYahoo()">
Yahoo Mail
</button>

<button class="default" onclick="openDefault()">
Default Mail App
</button>

<p class="note">
मेल खुलने के बाद To, Subject और Body जाँचकर स्वयं Send दबाएँ।
</p>

</div>
</div>

<script>

const to = "cirpascot@gmail.com,ascotpeople@gmail.com,ar.ascotcirp2025@gmail.com";

const subject =
"Serious Concerns Regarding Unauthorised Interference in the CIRP";

function getBody(){

let name =
document.getElementById("name").value.trim();

let unit =
document.getElementById("unit").value.trim();

return
"Dear Sir,\n\n" +
"Name: " + name + "\n" +
"Unit No.: " + unit + "\n\n" +
"Serious Concerns Regarding Unauthorised Interference in the CIRP.\n\n" +
"Regards,\n" + name;

}

function openGmail(){

let body = getBody();

let url =
"https://mail.google.com/mail/?view=cm&fs=1&tf=1" +
"&to=" + encodeURIComponent(to) +
"&su=" + encodeURIComponent(subject) +
"&body=" + encodeURIComponent(body);

window.location.href = url;

}

function openOutlook(){

let body = getBody();

let url =
"https://outlook.live.com/mail/0/deeplink/compose" +
"?to=" + encodeURIComponent(to) +
"&subject=" + encodeURIComponent(subject) +
"&body=" + encodeURIComponent(body);

window.location.href = url;

}

function openYahoo(){

let body = getBody();

let url =
"https://compose.mail.yahoo.com/" +
"?to=" + encodeURIComponent(to) +
"&subject=" + encodeURIComponent(subject) +
"&body=" + encodeURIComponent(body);

window.location.href = url;

}

function openDefault(){

let body = getBody();

let url =
"mailto:" + encodeURIComponent(to) +
"?subject=" + encodeURIComponent(subject) +
"&body=" + encodeURIComponent(body);

window.location.href = url;

}

</script>

</body>
</html>
